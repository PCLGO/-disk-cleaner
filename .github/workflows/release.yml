name: signed-release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      UPDATE_RSA_PRIVATE_KEY_XML_BASE64: ${{ secrets.UPDATE_RSA_PRIVATE_KEY_XML_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unsigned public releases
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64)) { throw 'A trusted code-signing certificate is required for public releases.' }
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_RSA_PRIVATE_KEY_XML_BASE64)) { throw 'The update-manifest RSA private key is required for public releases.' }
      - name: Inject update verification public key
        shell: powershell
        run: .\tools\Prepare-ReleaseKey.ps1 -PrivateKeyXmlBase64 $env:UPDATE_RSA_PRIVATE_KEY_XML_BASE64 -OutputPath .\app\Updates\release-public-key.xml
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Configuration Release
      - name: Authenticode sign executable
        shell: powershell
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found' }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certPath /p $env:SIGNING_CERT_PASSWORD .\artifacts\DiskCleanupAssistant.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed' }
          & $signtool verify /pa /all .\artifacts\DiskCleanupAssistant.exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed' }
          Remove-Item -LiteralPath $certPath -Force
          $hash = (Get-FileHash .\artifacts\DiskCleanupAssistant.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Resolve-Path .\artifacts).Path + '\DiskCleanupAssistant.exe.sha256', "$hash  DiskCleanupAssistant.exe`n", [Text.Encoding]::ASCII)
      - name: Create independently signed update manifest
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $base = 'https://github.com/${{ github.repository }}/releases'
          .\tools\New-ReleaseManifest.ps1 -Version $version -DownloadUrl "$base/download/${{ github.ref_name }}/DiskCleanupAssistant.exe" -ReleaseNotesUrl "$base/tag/${{ github.ref_name }}" -ExePath .\artifacts\DiskCleanupAssistant.exe -PrivateKeyXmlBase64 $env:UPDATE_RSA_PRIVATE_KEY_XML_BASE64 -OutputPath .\artifacts\latest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/DiskCleanupAssistant.exe
            artifacts/DiskCleanupAssistant.exe.sha256
            artifacts/latest.json
